# Deploy de la app Angular a producción (cPanel, FTPS) — spec 0046-b.
#
# Publicar:  git tag v1.2.0 && git push origin v1.2.0   → build + tests → aprobación → subida
#            → GitHub Release del tag con el build exacto (site.zip)
# Rollback:  Actions → "Deploy app (producción)" → Run workflow → tag anterior
#            → baja el site.zip de ese Release y lo sube tal cual (sin recompilar ni testear)
#
# El dominio NO se escribe acá: vive en la variable APP_DOMAIN del environment Production (es
# provisorio y va a cambiar). Setup y checklist de cambio de dominio: docs/DEPLOY.md.

name: Deploy app (producción)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Rollback: tag YA publicado (con Release) a volver a subir, ej. v1.1.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    # push de tag → build completo con gate de calidad. dispatch → build original del Release.
    name: Preparar build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - name: Resolver tag
        id: ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$PUSHED_TAG}"
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::'$TAG' no es un tag de versión válido (se espera v*, ej. v1.2.0)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.ref.outputs.tag }}
          fetch-depth: 0

      # AC-E5: solo se despliega código que ya está en main.
      - name: Verificar que el tag está en la historia de main
        run: |
          SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::El tag ${{ steps.ref.outputs.tag }} apunta a $SHA, que no está en main. Solo se despliegan tags creados sobre commits de main."
            exit 1
          fi

      # ── Publicación (push de tag) ────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        if: github.event_name == 'push'
        with:
          node-version: '22'
          cache: 'npm'

      - if: github.event_name == 'push'
        run: npm ci

      # Gate de calidad (AC1): cualquier rojo corta acá y no se pide aprobación.
      - name: Tests (test:ci)
        if: github.event_name == 'push'
        run: npm run test:ci
      - name: Lint arquitectónico (lint:arch)
        if: github.event_name == 'push'
        run: npm run lint:arch
      - name: Micro-suite del plan de deploy
        if: github.event_name == 'push'
        run: node scripts/lib/deploy-manifest.test.mjs

      - name: Build de producción
        if: github.event_name == 'push'
        run: npx ng build --configuration production

      # AC8: trazabilidad de la versión publicada. El SHA sale de git y no de GITHUB_SHA.
      - name: Escribir version.json
        if: github.event_name == 'push'
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          export SHA="$(git rev-parse HEAD)"
          node -e "require('fs').writeFileSync('dist/Autoescuela/browser/version.json', JSON.stringify({
            tag: process.env.TAG,
            sha: process.env.SHA,
            builtAt: new Date().toISOString(),
            run: process.env.GITHUB_RUN_ID
          }, null, 2) + '\n')"

      # ── Rollback (dispatch) — AC9 / AC-E6 ────────────────────────────────────────────────
      # Se re-despliega el build que ya se aprobó, no uno nuevo: recompilar un tag viejo puede
      # fallar por tests que dependen de la fecha o dar otro build si cambiaron las deps.
      - name: Descargar el build publicado del tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern site.zip --dir release 2>/dev/null; then
            echo "::error::No hay build publicado para $TAG (no existe su GitHub Release con site.zip). Solo se puede volver a versiones desplegadas con este pipeline. No se subió nada."
            exit 1
          fi
          mkdir -p dist/Autoescuela/browser
          unzip -q release/site.zip -d dist/Autoescuela/browser
          PUBLISHED_TAG="$(node -p "require('./dist/Autoescuela/browser/version.json').tag")"
          if [ "$PUBLISHED_TAG" != "$TAG" ]; then
            echo "::error::El site.zip del Release $TAG dice ser $PUBLISHED_TAG. No se subió nada."
            exit 1
          fi

      - name: Validar el build
        run: |
          test -f dist/Autoescuela/browser/index.html || { echo "::error::index.html no está en el build"; exit 1; }
          test -f dist/Autoescuela/browser/.htaccess || { echo "::error::.htaccess no está en el build"; exit 1; }
          cat dist/Autoescuela/browser/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/Autoescuela/browser/
          include-hidden-files: true # .htaccess
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Subida FTPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # AC2: la aprobación la exige el environment (Required reviewers).
    environment:
      name: Production
      url: https://${{ vars.APP_DOMAIN }}
    # AC-E1: nunca dos subidas en paralelo; no se cancela una subida en curso.
    concurrency:
      group: deploy-app-production
      cancel-in-progress: false
    steps:
      # AC-E2: fallar claro y antes de tocar el servidor si falta configuración.
      - name: Verificar configuración del environment
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          missing=()
          [ -n "$FTP_SERVER" ]   || missing+=("secret FTP_SERVER")
          [ -n "$FTP_USERNAME" ] || missing+=("secret FTP_USERNAME")
          [ -n "$FTP_PASSWORD" ] || missing+=("secret FTP_PASSWORD")
          [ -n "$APP_DOMAIN" ]   || missing+=("variable APP_DOMAIN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Falta configurar en el environment Production: ${missing[*]}. No se subió nada. Ver docs/DEPLOY.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.build.outputs.tag }}
          sparse-checkout: scripts

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Subir por FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          # FTPS obligatorio y con certificado verificado (AC3). --env-password lee LFTP_PASSWORD
          # sin que la contraseña pase por la línea de comandos.
          cat > session.lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 30
          open --env-password -u "$FTP_USERNAME" "$FTP_SERVER"
          EOF

          # 1. Manifiesto del deploy anterior (no existe en el primero).
          mkdir -p remote
          { cat session.lftp; echo 'set cmd:fail-exit no'; echo 'get -O remote .deploy-manifest.json'; } > get.lftp
          lftp -f get.lftp || true

          # 2. Qué borrar (función pura con test) + manifiesto nuevo.
          node scripts/deploy-ftp-plan.js site remote/.deploy-manifest.json

          # 3. Subida en orden seguro (AC4): todo menos index.html → version.json → index.html
          #    → borrados de hace 2 versiones (AC-E3) → manifiesto nuevo al final.
          {
            cat session.lftp
            echo 'mirror --reverse --verbose --parallel=4 --no-perms --exclude-glob index.html --exclude-glob version.json --exclude-glob .deploy-manifest.json site/ ./'
            echo 'put site/version.json -o version.json'
            echo 'put site/index.html -o index.html'
            while IFS= read -r f; do [ -n "$f" ] && echo "rm -f \"$f\""; done < delete-list.txt
            echo 'put site/.deploy-manifest.json -o .deploy-manifest.json'
            echo 'bye'
          } > deploy.lftp

          lftp -f deploy.lftp

      - name: Resumen
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          echo "### Desplegado ${{ needs.build.outputs.tag }} en https://$APP_DOMAIN" >> "$GITHUB_STEP_SUMMARY"
          echo "Verificar: https://$APP_DOMAIN/version.json" >> "$GITHUB_STEP_SUMMARY"

  # AC11: cada versión publicada queda registrada con su build exacto, que es lo que usa el
  # rollback. Solo tras una subida exitosa de un tag (un deploy rechazado o fallido no registra).
  release:
    name: Registrar versión publicada
    needs: [build, deploy]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Crear GitHub Release con site.zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          (cd site && zip -qr ../site.zip .)
          unzip -l site.zip | grep -q ' \.htaccess$' || { echo "::error::site.zip quedó sin .htaccess"; exit 1; }
          SHA="$(node -p "require('./site/version.json').sha")"
          NOTES="Build publicado en producción por el run ${GITHUB_RUN_ID} (commit ${SHA}). Rollback: Actions → Deploy app (producción) → Run workflow → tag ${TAG}."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" site.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" site.zip --verify-tag --title "$TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          fi
